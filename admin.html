</head>

<body>


<nav class="nav">

    <a class="brand" href="product.html">
        ✦ IndiraHub

    <div class="nav-links">

        <a href="product.html">
            Library

<main class="section">

    <p class="section-label">
        ✦ THE GRAND LIBRARY ✦
    </p>

    <h2>
        Owner Dashboard
    </h2>


    <div class="grid">


        <!-- BOOKS CARD -->

        <div class="card">

            <div class="card-body">

                <h3>
                    6
                </h3>

                <p>
                    Available Books
                </p>

            </div>

        </div>


        <!-- USERS CARD -->

        <div class="card">

            <div class="card-body">

                <h3>
                    24
                </h3>

                <p>
                    Registered Readers
                </p>

            </div>

        </div>


        <!-- SALES CARD -->

        <div class="card">

            <div class="card-body">

                <h3>
                    ₹8,499
                </h3>

                <p>
                    Demo Sales
                </p>

            </div>

        </div>


    </div>


    <h2>
        Recent Orders
    </h2>


    <table class="table">

        <tr>

            <th>
                Order
            </th>

            <th>
                Customer
            </th>

            <th>
                Total
            </th>

            <th>
                Status
            </th>

        </tr>


        <tr>

            <td>
                IH-DEMO2026
            </td>

            <td>
                reader@example.com
            </td>

            <td>
                ₹1,099
            </td>

            <td>
                <span class="status">
                    Placed
                </span>
            </td>

        </tr>


        <tr>

            <td>
                IH-DEMO2027
            </td>

            <td>
                student@example.com
            </td>

            <td>
                ₹1,499
            </td>

            <td>
                <span class="status">
                    Shipped
                </span>
            </td>

        </tr>


    </table>


</main>

</html>
