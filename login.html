<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sign in or register for IndiraHub - Electronics & Books.">
    <title>Sign In / Register | IndiraHub</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/style.css">
    <style>
        .auth-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            position: relative;
            z-index: 1;
        }

        .auth-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            width: 100%;
            max-width: 460px;
            padding: 40px;
            box-shadow: var(--shadow-elevated);
            backdrop-filter: blur(16px);
            animation: modalIn 0.35s ease;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .auth-header .brand-logo {
            justify-content: center;
            margin-bottom: 16px;
        }

        .auth-header h2 {
            font-family: var(--font-heading);
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 6px;
        }

        .auth-header p {
            color: var(--text-secondary);
            font-size: 0.92rem;
        }

        .auth-tabs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            background: rgba(255, 255, 255, 0.05);
            border-radius: var(--radius-md);
            padding: 4px;
            margin-bottom: 24px;
            border: 1px solid var(--border-color);
        }

        .auth-tab-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-family: var(--font-body);
            font-size: 0.92rem;
            font-weight: 700;
            padding: 10px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: var(--transition);
        }

        .auth-tab-btn.active {
            background: var(--primary);
            color: white;
            box-shadow: 0 2px 10px var(--primary-glow);
        }

        .quick-fill-box {
            background: rgba(99, 102, 241, 0.08);
            border: 1px solid rgba(99, 102, 241, 0.2);
            border-radius: var(--radius-md);
            padding: 12px 16px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.85rem;
        }

        .quick-fill-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--border-color);
            color: var(--primary-light);
            font-size: 0.78rem;
            font-weight: 700;
            padding: 5px 12px;
            border-radius: var(--radius-full);
            cursor: pointer;
            transition: var(--transition);
        }

        .quick-fill-btn:hover {
            background: var(--primary);
            color: white;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 24px;
            color: var(--text-muted);
            font-size: 0.88rem;
            text-decoration: none;
            transition: var(--transition);
        }

        .back-link:hover {
            color: var(--primary-light);
        }
    </style>
</head>
<body>

    <!-- Ambient Lighting Effects -->
    <div class="ambient-glow"></div>
    <div class="ambient-glow-2"></div>

    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <a href="index.html" class="brand-logo">
                    <div class="brand-icon">⚡</div>
                    <span class="gradient-text">IndiraHub</span>
                </a>
                <h2 id="auth-title">Welcome Back</h2>
                <p id="auth-subtitle">Sign in to access your cart, orders, and exclusive deals.</p>
            </div>

            <!-- Tab Switcher -->
            <div class="auth-tabs">
                <button type="button" class="auth-tab-btn active" id="tab-login" onclick="switchAuthTab('login')">Sign In</button>
                <button type="button" class="auth-tab-btn" id="tab-register" onclick="switchAuthTab('register')">Register</button>
            </div>

            <!-- Demo Fill Helper -->
            <div class="quick-fill-box" id="demo-box">
                <span style="color:var(--text-secondary)">⚡ Quick Demo Login:</span>
                <div style="display:flex; gap:6px;">
                    <button type="button" class="quick-fill-btn" onclick="fillDemo('demo', 'demo123')">Demo User</button>
                    <button type="button" class="quick-fill-btn" onclick="fillDemo('admin', 'admin123')">Admin</button>
                </div>
            </div>

            <!-- LOGIN FORM -->
            <form id="login-form" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label class="form-label" for="login-identifier">Username or Email</label>
                    <input type="text" id="login-identifier" class="form-input" placeholder="e.g. demo or demo@indirahub.com" required autocomplete="username">
                </div>

                <div class="form-group">
                    <label class="form-label" for="login-password">Password</label>
                    <input type="password" id="login-password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
                </div>

                <button type="submit" class="checkout-btn" style="margin-top: 10px;">
                    <span>Sign In to IndiraHub ⚡</span>
                </button>
            </form>

            <!-- REGISTER FORM -->
            <form id="register-form" style="display: none;" onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label class="form-label" for="reg-fullname">Full Name</label>
                    <input type="text" id="reg-fullname" class="form-input" placeholder="e.g. Rahul Sharma" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="reg-username">Username</label>
                    <input type="text" id="reg-username" class="form-input" placeholder="e.g. rahul_s" required minlength="3">
                </div>

                <div class="form-group">
                    <label class="form-label" for="reg-email">Email Address</label>
                    <input type="email" id="reg-email" class="form-input" placeholder="e.g. rahul@example.com" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="reg-password">Password (min. 6 characters)</label>
                    <input type="password" id="reg-password" class="form-input" placeholder="••••••••" required minlength="6">
                </div>

                <button type="submit" class="checkout-btn" style="margin-top: 10px;">
                    <span>Create My Account 🚀</span>
                </button>
            </form>

            <a href="index.html" class="back-link">← Return to IndiraHub Store</a>
        </div>
    </div>

    <!-- Scripts -->
    <script>
        function switchAuthTab(mode) {
            const loginForm = document.getElementById('login-form');
            const registerForm = document.getElementById('register-form');
            const tabLogin = document.getElementById('tab-login');
            const tabRegister = document.getElementById('tab-register');
            const authTitle = document.getElementById('auth-title');
            const authSubtitle = document.getElementById('auth-subtitle');
            const demoBox = document.getElementById('demo-box');

            if (mode === 'login') {
                loginForm.style.display = 'block';
                registerForm.style.display = 'none';
                tabLogin.classList.add('active');
                tabRegister.classList.remove('active');
                authTitle.textContent = 'Welcome Back';
                authSubtitle.textContent = 'Sign in to access your cart, orders, and exclusive deals.';
                if (demoBox) demoBox.style.display = 'flex';
            } else {
                loginForm.style.display = 'none';
                registerForm.style.display = 'block';
                tabLogin.classList.remove('active');
                tabRegister.classList.add('active');
                authTitle.textContent = 'Join IndiraHub';
                authSubtitle.textContent = 'Create your account to unlock orders tracking & express checkout.';
                if (demoBox) demoBox.style.display = 'none';
            }
        }

        function fillDemo(username, password) {
            document.getElementById('login-identifier').value = username;
            document.getElementById('login-password').value = password;
        }

        async function handleLogin(e) {
            e.preventDefault();
            const identifier = document.getElementById('login-identifier').value.trim();
            const password = document.getElementById('login-password').value.trim();

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ identifier, password })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    localStorage.setItem('indirahub_user', JSON.stringify({
                        id: data.userId,
                        username: data.username,
                        email: data.email,
                        fullName: data.fullName,
                        role: data.role
                    }));
                    alert('Login successful! Welcome back, ' + (data.fullName || data.username));
                    window.location.href = 'index.html';
                    return;
                } else {
                    alert(data.message || 'Invalid username/email or password');
                    return;
                }
            } catch (err) {
                console.warn('API error, falling back to local demo authentication:', err);
                // Demo fallback if backend is not currently running
                if (identifier === 'demo' || identifier === 'demo@indirahub.com' || identifier === 'admin') {
                    localStorage.setItem('indirahub_user', JSON.stringify({
                        id: 1,
                        username: identifier,
                        email: identifier.includes('@') ? identifier : identifier + '@indirahub.com',
                        fullName: identifier === 'admin' ? 'Indira Admin' : 'Demo User',
                        role: identifier === 'admin' ? 'ADMIN' : 'CUSTOMER'
                    }));
                    alert('Login successful! (Offline Demo Mode)');
                    window.location.href = 'index.html';
                } else {
                    alert('Backend connection error or invalid credentials. You can use the Demo User buttons.');
                }
            }
        }

        async function handleRegister(e) {
            e.preventDefault();
            const fullName = document.getElementById('reg-fullname').value.trim();
            const username = document.getElementById('reg-username').value.trim();
            const email = document.getElementById('reg-email').value.trim();
            const password = document.getElementById('reg-password').value.trim();

            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ fullName, username, email, password })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    localStorage.setItem('indirahub_user', JSON.stringify({
                        id: data.userId,
                        username: data.username,
                        email: data.email,
                        fullName: data.fullName,
                        role: data.role
                    }));
                    alert('Registration successful! Welcome to IndiraHub.');
                    window.location.href = 'index.html';
                } else {
                    alert(data.message || 'Registration failed.');
                }
            } catch (err) {
                console.warn('Backend API error on register:', err);
                // Local fallback
                localStorage.setItem('indirahub_user', JSON.stringify({
                    id: Date.now(),
                    username: username,
                    email: email,
                    fullName: fullName,
                    role: 'CUSTOMER'
                }));
                alert('Account created successfully! Welcome to IndiraHub.');
                window.location.href = 'index.html';
            }
        }
    </script>
</body>
</html>
