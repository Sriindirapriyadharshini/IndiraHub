<!-- login.html -->

<!doctype html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Sign In | IndiraHub</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>


<nav class="nav">

    <a class="brand" href="product.html">
        ✦ IndiraHub
    </a>

</nav>


<main class="form">


    <p class="section-label">
        ✦ WELCOME, READER ✦
    </p>


    <h1>
        Enter the Library
    </h1>


    <p>
        Sign in to explore magical stories
        and manage your book collection.
    </p>


    <form action="product.html" method="get">


        <label for="email">
            Email
        </label>


        <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email"
            required
        >


        <label for="password">
            Password
        </label>


        <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            required
        >


        <br>


        <button class="button" type="submit">
            Enter the Library
        </button>


    </form>


    <p>
        New to IndiraHub?

        <a href="register.html">
            Create an account
        </a>

    </p>


    <p class="view-note">
        Demo login: This HTML form redirects to the
        bookstore page. It does not validate users
        without a backend.
    </p>


</main>


</body>

</html>
